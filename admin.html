<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora | Administration</title>

<style>
:root{
  --black:#080808;
  --gold:#d9a126;
  --white:#fff;
  --soft:#f5f5f5;
  --border:#e5e5e5;
  --gray:#777;
  --red:#b42318;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--soft);
  color:#151515;
}

button,input,select{
  font:inherit;
}

/* =========================
   CONNEXION
========================= */

#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
  background:
  radial-gradient(circle at 80% 20%,rgba(217,161,38,.16),transparent 30%),
  linear-gradient(135deg,#050505,#111);
}

.login-card{
  background:white;
  width:100%;
  max-width:430px;
  padding:40px;
  border-radius:20px;
  box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.login-logo{
  width:160px;
  display:block;
  margin:0 auto 25px;
  border-radius:10px;
}

.login-card h1{
  text-align:center;
  margin-bottom:8px;
}

.login-card > p{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:28px;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.field input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:9px;
  outline:none;
}

.field input:focus{
  border-color:var(--gold);
}

.login-button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:9px;
  background:#090909;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.login-button:disabled{
  opacity:.6;
}

#errorMessage{
  display:none;
  margin-top:15px;
  padding:12px;
  background:#fff0f0;
  color:var(--red);
  border-radius:8px;
  font-size:13px;
  text-align:center;
}

/* =========================
   ADMIN
========================= */

#adminPage{
  display:none;
}

header{
  background:#070707;
  color:white;
}

.header-inner{
  width:min(1200px,92%);
  margin:auto;
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.header-logo{
  width:140px;
}

.admin-info{
  display:flex;
  align-items:center;
  gap:15px;
}

.admin-email{
  color:#aaa;
  font-size:13px;
}

.logout{
  border:0;
  background:var(--gold);
  color:#111;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

main{
  width:min(1200px,92%);
  margin:38px auto 70px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:28px;
}

.eyebrow{
  color:#a87000;
  font-size:11px;
  text-transform:uppercase;
  font-weight:bold;
  letter-spacing:1.5px;
}

.top h1{
  margin-top:7px;
  font-size:34px;
}

.top p{
  color:#777;
  margin-top:6px;
}

.refresh{
  background:white;
  border:1px solid #ddd;
  padding:11px 16px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
   5 STATUTS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
  margin-bottom:30px;
}

.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:21px;
}

.stat span{
  color:#777;
  font-size:13px;
}

.stat strong{
  display:block;
  font-size:29px;
  margin-top:8px;
}

/* =========================
   DEMANDES
========================= */

.requests-section{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
}

.requests-header{
  padding:21px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.requests-header h2{
  font-size:20px;
}

.search{
  width:300px;
  max-width:100%;
  padding:12px 14px;
  border:1px solid #ddd;
  border-radius:9px;
  outline:none;
}

#requestsContainer{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.request-card{
  border:1px solid #e5e5e5;
  border-radius:15px;
  padding:21px;
  background:#fff;
}

.request-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  padding-bottom:17px;
  margin-bottom:17px;
  border-bottom:1px solid #eee;
}

.request-number{
  font-size:12px;
  color:#a87000;
  font-weight:bold;
  margin-bottom:5px;
}

.request-name{
  font-size:19px;
  font-weight:bold;
}

.request-date{
  font-size:11px;
  color:#888;
  text-align:right;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.info{
  min-width:0;
}

.info-label{
  display:block;
  color:#888;
  font-size:11px;
  text-transform:uppercase;
  margin-bottom:5px;
}

.info-value{
  font-size:14px;
  overflow-wrap:anywhere;
}

.card-actions{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:9px;
  margin-top:20px;
  padding-top:17px;
  border-top:1px solid #eee;
}

.status{
  min-width:0;
  padding:11px;
  border:1px solid #ddd;
  border-radius:8px;
  background:white;
}

.details{
  background:#090909;
  color:white;
  border:0;
  padding:11px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.delete{
  background:#b42318;
  color:white;
  border:0;
  padding:11px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.delete:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.empty{
  padding:45px 20px;
  text-align:center;
  color:#777;
}

/* =========================
   MODALE
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:1000;
  padding:20px;
  overflow-y:auto;
}

.modal-content{
  max-width:680px;
  margin:35px auto;
  background:white;
  border-radius:18px;
  padding:28px;
}

.modal-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:20px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#eee;
  font-size:20px;
  cursor:pointer;
}

.detail-row{
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.detail-row strong{
  display:block;
  color:#777;
  text-transform:uppercase;
  font-size:11px;
  margin-bottom:5px;
}

.detail-row p{
  line-height:1.5;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  #requestsContainer{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){

  main{
    width:92%;
    margin-top:28px;
  }

  .header-inner{
    min-height:70px;
  }

  .header-logo{
    width:120px;
  }

  .admin-email{
    display:none;
  }

  .top{
    flex-direction:column;
    align-items:flex-start;
  }

  .top h1{
    font-size:29px;
  }

  .refresh{
    width:100%;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    padding:17px;
  }

  .stat strong{
    font-size:27px;
  }

  .requests-header{
    flex-direction:column;
    align-items:stretch;
  }

  .search{
    width:100%;
  }

  #requestsContainer{
    padding:13px;
    gap:13px;
  }

  .request-card{
    padding:17px;
  }

  .request-top{
    flex-direction:column;
  }

  .request-date{
    text-align:left;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .card-actions{
    grid-template-columns:1fr;
  }

  .status,
  .details,
  .delete{
    width:100%;
  }

  .login-card{
    padding:30px 22px;
  }
}
</style>
</head>

<body>

<section id="loginPage">

<div class="login-card">

<img src="logo-nexora.jpg"
alt="Nexora"
class="login-logo">

<h1>Administration</h1>

<p>Connectez-vous pour gérer les demandes Nexora.</p>

<form id="loginForm">

<div class="field">
<label for="adminEmail">Adresse e-mail</label>
<input type="email"
id="adminEmail"
required
autocomplete="email">
</div>

<div class="field">
<label for="adminPassword">Mot de passe</label>
<input type="password"
id="adminPassword"
required
autocomplete="current-password">
</div>

<button type="submit"
class="login-button"
id="loginButton">
Se connecter
</button>

<div id="errorMessage"></div>

</form>

</div>
</section>


<section id="adminPage">

<header>
<div class="header-inner">

<img src="logo-nexora.jpg"
alt="Nexora"
class="header-logo">

<div class="admin-info">

<span class="admin-email"
id="connectedEmail"></span>

<button class="logout"
id="logoutButton">
Déconnexion
</button>

</div>
</div>
</header>


<main>

<div class="top">

<div>

<span class="eyebrow">
Nexora Administration
</span>

<h1>Demandes clients</h1>

<p>
Consultez et gérez les projets reçus.
</p>

</div>

<button class="refresh"
id="refreshButton">
Actualiser
</button>

</div>


<div class="stats">

<div class="stat">
<span>Nouvelles</span>
<strong id="newCount">0</strong>
</div>

<div class="stat">
<span>En discussion</span>
<strong id="discussionCount">0</strong>
</div>

<div class="stat">
<span>Acceptées</span>
<strong id="acceptedCount">0</strong>
</div>

<div class="stat">
<span>En cours</span>
<strong id="progressCount">0</strong>
</div>

<div class="stat">
<span>Terminées</span>
<strong id="doneCount">0</strong>
</div>

</div>


<div class="requests-section">

<div class="requests-header">

<h2>Liste des demandes</h2>

<input type="search"
id="searchInput"
class="search"
placeholder="Rechercher un client...">

</div>

<div id="requestsContainer"></div>

<div class="empty"
id="emptyMessage"
style="display:none;">
Aucune demande trouvée.
</div>

</div>

</main>
</section>


<div class="modal"
id="detailsModal">

<div class="modal-content">

<div class="modal-top">

<h2>Détails de la demande</h2>

<button class="close"
id="closeModal">×</button>

</div>

<div id="modalBody"></div>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://bfegrpipkgpuificmgwi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E9mwl-2QpyIIsh3gCgt_6w_naHoPtGa";

const ADMIN_UID =
"f7dedfff-1da0-4aef-9919-d65e3c268b7e";

const { createClient } = supabase;

const db =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ==============================
   ÉLÉMENTS
============================== */

const loginPage =
document.getElementById("loginPage");

const adminPage =
document.getElementById("adminPage");

const loginForm =
document.getElementById("loginForm");

const loginButton =
document.getElementById("loginButton");

const errorMessage =
document.getElementById("errorMessage");

const requestsContainer =
document.getElementById("requestsContainer");

const emptyMessage =
document.getElementById("emptyMessage");

const searchInput =
document.getElementById("searchInput");

const refreshButton =
document.getElementById("refreshButton");

const logoutButton =
document.getElementById("logoutButton");

const detailsModal =
document.getElementById("detailsModal");

const closeModal =
document.getElementById("closeModal");

let requests = [];


/* ==============================
   CONNEXION
============================== */

loginForm.addEventListener(
"submit",
async function(e){

e.preventDefault();

errorMessage.style.display =
"none";

loginButton.disabled =
true;

loginButton.textContent =
"Connexion...";

const email =
document
.getElementById("adminEmail")
.value
.trim();

const password =
document
.getElementById("adminPassword")
.value;

const { data,error } =
await db.auth.signInWithPassword({
email:email,
password:password
});

if(error){

errorMessage.textContent =
"Adresse e-mail ou mot de passe incorrect.";

errorMessage.style.display =
"block";

loginButton.disabled =
false;

loginButton.textContent =
"Se connecter";

return;
}

if(
!data.user ||
data.user.id !== ADMIN_UID
){

await db.auth.signOut();

errorMessage.textContent =
"Ce compte n'est pas autorisé.";

errorMessage.style.display =
"block";

loginButton.disabled =
false;

loginButton.textContent =
"Se connecter";

return;
}

loginButton.disabled =
false;

loginButton.textContent =
"Se connecter";

await showAdmin(
data.user
);

});


/* ==============================
   ADMIN
============================== */

async function showAdmin(user){

loginPage.style.display =
"none";

adminPage.style.display =
"block";

document
.getElementById("connectedEmail")
.textContent =
user.email || "";

await loadRequests();

}


/* ==============================
   CHARGER DEMANDES
============================== */

async function loadRequests(){

requestsContainer.innerHTML =
'<div class="empty">Chargement...</div>';

emptyMessage.style.display =
"none";

const { data,error } =
await db
.from("Demandes")
.select("*")
.order(
"created_at",
{ascending:false}
);

if(error){

console.error(error);

requestsContainer.innerHTML =
'<div class="empty">Impossible de charger les demandes.</div>';

return;
}

requests =
data || [];

updateStats();

renderRequests(
requests
);

}


/* ==============================
   5 COMPTEURS
============================== */

function updateStats(){

document
.getElementById("newCount")
.textContent =
requests.filter(
x => x.statut === "Nouvelle"
).length;

document
.getElementById("discussionCount")
.textContent =
requests.filter(
x => x.statut === "En discussion"
).length;

document
.getElementById("acceptedCount")
.textContent =
requests.filter(
x => x.statut === "Acceptée"
).length;

document
.getElementById("progressCount")
.textContent =
requests.filter(
x => x.statut === "En cours"
).length;

document
.getElementById("doneCount")
.textContent =
requests.filter(
x => x.statut === "Terminée"
).length;

}


/* ==============================
   AFFICHER DEMANDES
============================== */

function renderRequests(list){

requestsContainer.innerHTML = "";

if(!list.length){

emptyMessage.style.display =
"block";

return;
}

emptyMessage.style.display =
"none";


list.forEach(function(item){

const card =
document.createElement("article");

card.className =
"request-card";

const date =
item.created_at
?
new Date(
item.created_at
).toLocaleString("fr-FR")
:
"-";


card.innerHTML = `

<div class="request-top">

<div>

<div class="request-number">
${escapeHtml(item.numero_demande || "-")}
</div>

<div class="request-name">
${escapeHtml(item.nom || "-")}
</div>

</div>

<div class="request-date">
${escapeHtml(date)}
</div>

</div>


<div class="info-grid">

<div class="info">
<span class="info-label">
Téléphone / WhatsApp
</span>
<div class="info-value">
${escapeHtml(item.telephone || "-")}
</div>
</div>

<div class="info">
<span class="info-label">
E-mail
</span>
<div class="info-value">
${escapeHtml(item.email || "-")}
</div>
</div>

<div class="info">
<span class="info-label">
Service
</span>
<div class="info-value">
${escapeHtml(item.service || "-")}
</div>
</div>

<div class="info">
<span class="info-label">
Budget
</span>
<div class="info-value">
${escapeHtml(item.budget || "-")}
</div>
</div>

<div class="info">
<span class="info-label">
Délai
</span>
<div class="info-value">
${escapeHtml(item.delai || "-")}
</div>
</div>

<div class="info">
<span class="info-label">
Entreprise
</span>
<div class="info-value">
${escapeHtml(item.entreprise || "-")}
</div>
</div>

</div>


<div class="card-actions">

<select
class="status"
data-id="${escapeHtml(String(item.id))}">

${statusOption(
"Nouvelle",
item.statut
)}

${statusOption(
"En discussion",
item.statut
)}

${statusOption(
"Acceptée",
item.statut
)}

${statusOption(
"En cours",
item.statut
)}

${statusOption(
"Terminée",
item.statut
)}

</select>


<button
class="details"
data-detail-id="${escapeHtml(String(item.id))}">
Voir les détails
</button>


<button
class="delete"
data-delete-id="${escapeHtml(String(item.id))}">
Supprimer
</button>

</div>
`;

requestsContainer
.appendChild(card);

});


/* CHANGER STATUT */

document
.querySelectorAll(".status")
.forEach(function(select){

select.addEventListener(
"change",
async function(){

await updateStatus(
this.dataset.id,
this.value
);

});

});


/* VOIR DÉTAILS */

document
.querySelectorAll(".details")
.forEach(function(button){

button.addEventListener(
"click",
function(){

openDetails(
this.dataset.detailId
);

});

});


/* SUPPRIMER */

document
.querySelectorAll(".delete")
.forEach(function(button){

button.addEventListener(
"click",
async function(){

await deleteRequest(
this.dataset.deleteId
);

});

});

}


/* ==============================
   OPTIONS STATUT
============================== */

function statusOption(
value,
current
){

return `
<option
value="${value}"
${current === value ? "selected" : ""}>
${value}
</option>
`;

}


/* ==============================
   MODIFIER STATUT
============================== */

async function updateStatus(
id,
newStatus
){

const { error } =
await db
.from("Demandes")
.update({
statut:newStatus
})
.eq(
"id",
id
);

if(error){

console.error(error);

alert(
"Impossible de modifier le statut."
);

await loadRequests();

return;
}

const item =
requests.find(
x =>
String(x.id) ===
String(id)
);

if(item){
item.statut =
newStatus;
}

updateStats();

}


/* ==============================
   SUPPRIMER DEMANDE
============================== */

async function deleteRequest(id){

const item =
requests.find(
x =>
String(x.id) ===
String(id)
);

if(!item){
return;
}

const numero =
item.numero_demande ||
"cette demande";

const confirmation =
confirm(
"Voulez-vous vraiment supprimer la demande " +
numero +
" ?\n\nCette action est définitive."
);

if(!confirmation){
return;
}

const button =
document.querySelector(
`.delete[data-delete-id="${CSS.escape(String(id))}"]`
);

if(button){
button.disabled = true;
button.textContent =
"Suppression...";
}

const { error } =
await db
.from("Demandes")
.delete()
.eq(
"id",
id
);

if(error){

console.error(error);

alert(
"La demande n'a pas pu être supprimée."
);

if(button){
button.disabled = false;
button.textContent =
"Supprimer";
}

return;
}


/*
VÉRIFICATION :
on recharge les données depuis Supabase
après la suppression.
*/

await loadRequests();

alert(
"La demande " +
numero +
" a été supprimée."
);

}


/* ==============================
   DÉTAILS
============================== */

function openDetails(id){

const item =
requests.find(
x =>
String(x.id) ===
String(id)
);

if(!item){
return;
}

document
.getElementById("modalBody")
.innerHTML =

detail(
"Numéro de demande",
item.numero_demande
)

+

detail(
"Client",
item.nom
)

+

detail(
"Entreprise",
item.entreprise
)

+

detail(
"Téléphone / WhatsApp",
item.telephone
)

+

detail(
"E-mail",
item.email
)

+

detail(
"Service",
item.service
)

+

detail(
"Objectif",
item.objectif
)

+

detail(
"Description du projet",
item.description
)

+

detail(
"Identité / Logo",
item.identite_logo
)

+

detail(
"Budget",
item.budget
)

+

detail(
"Délai",
item.delai
)

+

detail(
"Statut",
item.statut
);

detailsModal.style.display =
"block";

}


function detail(
title,
value
){

return `

<div class="detail-row">

<strong>
${escapeHtml(title)}
</strong>

<p>
${escapeHtml(value || "-")}
</p>

</div>

`;

}


/* ==============================
   RECHERCHE
============================== */

searchInput.addEventListener(
"input",
function(){

const term =
this.value
.toLowerCase()
.trim();

const filtered =
requests.filter(function(item){

return [

item.nom,
item.email,
item.telephone,
item.numero_demande,
item.service,
item.statut

]
.join(" ")
.toLowerCase()
.includes(term);

});

renderRequests(
filtered
);

});


/* ==============================
   ACTUALISER
============================== */

refreshButton.addEventListener(
"click",
loadRequests
);

============================== */

async function(){

adminPage.style.display =
"none";

"flex";

loginForm.reset();

});

/* ==============================
   SÉCURITÉ AFFICHAGE
============================== */

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ==============================
   SESSION
============================== */

async function checkSession(){

const {
data:{
session
}
} =
await db.auth.getSession();


if(
session &&
session.user &&
session.user.id === ADMIN_UID
){

await showAdmin(
session.user
);

return;
}


if(session){
await db.auth.signOut();
}


loginPage.style.display =
"flex";

adminPage.style.display =
"none";

}


checkSession();

</script>
